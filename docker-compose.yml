services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: coffer_dev
      POSTGRES_USER: coffer
      POSTGRES_PASSWORD: coffer_local
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - coffer_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coffer -d coffer_dev"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - coffer_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  coffer_postgres:
  coffer_redis:
